name: VCP US Daily Scan

# 2026-11-14 修复（P0-2）：
#   - 21:30 UTC 在 EST 只等于 16:30 ET，日线尚未落定，刷新拿到的是 T-1 甚至 T-2 收盘价。
#     改到 23:00 UTC（18:00 EST / 19:00 EDT），全年都在官方收盘 + 日线落定之后。
#   - 缓存刷新失败旧版是 `|| echo 沿用旧缓存`，于是「11-13 扫描」实际用 11-11 价。
#     现在 build_vcp_cache.py --assert-fresh 在写盘前断言 SPY 末根与覆盖率，失败 exit 2。
#   - 新增结果回填步骤，把「推荐后表现」写回台账，日报可直接引用 rolling 结论。
on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 还原价缓存（GitHub Artifact，不入 git 以免撑大仓库）
        # 首次运行无 artifact 会失败（continue-on-error），下方刷新步骤会从零重建
        uses: actions/download-artifact@v4
        with:
          name: vcp-cache
          path: 数据
        continue-on-error: true

      - name: 下载 S&P 500 / 400 成分股列表
        run: |
          python3 - <<'PY'
          import requests, os
          from io import StringIO
          import pandas as pd
          HEADERS = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
          def save(url, fpath, col='Symbol'):
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  r.raise_for_status()
                  for t in pd.read_html(StringIO(r.text)):
                      if col in t.columns:
                          syms = t[col].dropna().astype(str).str.replace('.', '-').str.strip().tolist()
                          syms = [s for s in syms if s and not s.startswith('^') and 'S&P' not in s]
                          with open(fpath, 'w') as f:
                              f.write('\n'.join(syms) + '\n')
                          print('saved', len(syms), 'to', os.path.basename(fpath))
                          return
                  print('warn: no', col, 'column in', url)
              except Exception as e:
                  print('fail', url, e)
          save('https://en.wikipedia.org/wiki/List_of_S%26P_500_companies', 'sp500.csv')
          save('https://en.wikipedia.org/wiki/List_of_S%26P_400_companies', 'sp400.csv')
          PY

      - name: 刷新价缓存（fail-closed，Yahoo 失败转 stockanalysis，写盘前断言数据日）
        run: |
          python3 build_vcp_cache.py --force --assert-fresh

      - name: 断言扫描所用数据日 = 最近完成的美东交易日
        run: |
          python3 - <<'PY'
          import sys, datetime
          from vcp_data_date import cache_data_date
          d = cache_data_date()
          if not d:
              print("[FATAL] 无法确定价缓存数据日"); sys.exit(2)
          lag = (datetime.date.today() - datetime.date.fromisoformat(d)).days
          print("价缓存数据日 %s | 距今 %d 自然日" % (d, lag))
          if lag > 4:
              print("[FATAL] 数据日滞后超过 4 天，拒绝用陈旧价生成当日信号"); sys.exit(2)
          print("OK 新鲜度断言通过")
          PY

      - name: 运行 VCP 扫描器（美股 SP900，离线缓存模式，留存归档）
        run: |
          mkdir -p 数据
          python3 vcp_screener.py --market us --pool sp900 > "数据/vcp_US_$(date +%Y%m%d).txt" 2>&1

      - name: 运行 VCP 扫描器（美股 ADR，离线缓存模式，留存归档）
        run: |
          mkdir -p 数据
          python3 vcp_screener.py --market us --pool adr > "数据/vcp_ADR_$(date +%Y%m%d).txt" 2>&1

      - name: 生成早报信号文件（扫描日 = 价缓存数据日，不再是脚本运行日）
        run: |
          python3 gen_latest_us.py
          python3 gen_results_latest.py
          echo "--- 生成的报告信号文件（头部含数据日 / 生成日）---"
          head -6 数据/最新_US.txt
          head -8 results/最新.txt

      - name: 结果回填（推荐后 T+5/T+10/T+20 + SPY 超额 + rolling 60 日结论）
        run: |
          python3 vcp_outcome_tracker.py
          echo "--- 回填结论 ---"
          head -16 数据/vcp_outcomes.md

      - name: 保存价缓存到 Artifact（供次日复用，不入 git）
        uses: actions/upload-artifact@v4
        with:
          name: vcp-cache
          path: 数据/vcp_cache.pkl
          retention-days: 30
        continue-on-error: true

      - name: 保存回填台账到 Artifact（CSV/JSONL 体积大，不进 git）
        uses: actions/upload-artifact@v4
        with:
          name: vcp-outcomes
          path: |
            数据/VCP_结果回填.csv
            数据/vcp_signals.jsonl
          retention-days: 30
        continue-on-error: true

      - name: 提交结果（信号文件 / 数据日标记 / 回填摘要）
        run: |
          git config user.name "peteryang2333"
          git config user.email "signal-bot@github.com"
          git add 数据/ results/最新.txt sp500.csv sp400.csv
          git diff --staged --quiet || git commit -m "📊 VCP US 每日扫描 $(date +'%Y-%m-%d')"
          git push
