name: VCP 多市场扫描

on:
  schedule:
    - cron: '30 21 * * 1-5'    # 🇺🇸 美股 5:30 CST (周二~六)
    - cron: '0 7 * * 1-5'      # 🇯🇵 日本 15:00 CST
    - cron: '30 7 * * 1-5'     # 🇰🇷 韩国 15:30 CST
  workflow_dispatch:
    inputs:
      market:
        description: '市场 (us/jp/kr/all)'
        required: true
        default: 'all'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: pip install yfinance pandas lxml requests

      - name: 确定扫描市场
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ github.event.inputs.market }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "21" ]; then
              echo "market=us" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "07" ]; then
              if [ "$(date -u +%M)" -lt "30" ]; then
                echo "market=jp" >> $GITHUB_OUTPUT
              else
                echo "market=kr" >> $GITHUB_OUTPUT
              fi
            else
              echo "market=all" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 下载 SP 成分股
        run: python3 .github/scripts/download_sp.py

      - name: 运行 VCP 扫描
        run: python3 vcp_screener.py --market ${{ steps.market.outputs.market }} --pool sp900 2>&1 | tee scan_result.txt

      - name: 更新信号跟踪表
        run: python3 vcp_tracker.py --scan-all || true

      - name: 提交结果
        run: |
          git config user.name "VCP Bot"
          git config user.email "vcp-bot@github.com"
          git add 数据/ sp500.csv sp400.csv
          git diff --staged --quiet || git commit -m "📊 VCP 扫描结果 $(date +'%Y-%m-%d')"
          git push
