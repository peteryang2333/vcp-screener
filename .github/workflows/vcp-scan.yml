name: Daily Quant Signal

on:
  schedule:
    - cron: '45 19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # 更新到 3.11，保持一致

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strategy Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: python3 daily_signal.py

      - name: Commit results
        run: |
          mkdir -p results
          # 检查 result.txt 是否存在后再复制
          if [ -f result.txt ]; then
            cp result.txt "results/$(date +'%Y-%m-%d').txt"
            cp result.txt results/最新.txt
            git config user.name "peteryang2333"
            git config user.email "signal-bot@github.com"
            git add results/
            git diff --staged --quiet || git commit -m "📊 每日信号 $(date +'%Y-%m-%d')"
            git push
          else
            echo "⚠️ result.txt not generated, skipping commit"
            exit 1
          fi
