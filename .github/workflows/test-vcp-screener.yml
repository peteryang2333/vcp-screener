name: 测试修复的VCP扫描器

on:
  workflow_dispatch:  # 手动触发

jobs:
  test-vcp-screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 运行 VCP 扫描器
        run: |
          echo "================================"
          echo "🚀 开始运行修复后的 VCP 扫描器"
          echo "================================"
          python3 vcp_screener.py --pool sp500
          echo ""
          echo "================================"
          echo "✅ VCP 扫描器运行完成"
          echo "================================"
